<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پازل رنگی 🧩</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #17172b;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      color: white;
      padding: 20px;
    }

    .game {
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #e0e7ff;
    }

    .subtitle {
      color: #a5b4fc;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: #0f0f1a;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 24px;
    }

    .tile {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      user-select: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }

    .tile:active {
      transform: scale(0.95);
    }

    .tile.empty {
      background: transparent !important;
      cursor: default;
      box-shadow: none;
    }

    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      font-family: inherit;
    }

    button:hover {
      background: #4f46e5;
    }

    button:active {
      transform: scale(0.97);
    }

    .moves {
      margin-top: 18px;
      color: #c7d2fe;
      font-size: 1.05rem;
    }

    .win-message {
      margin-top: 20px;
      padding: 16px;
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 14px;
      font-size: 1.3rem;
      font-weight: bold;
      display: none;
      animation: pop 0.4s ease;
    }
