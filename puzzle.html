<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پازل رنگی 🧩</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #17172b;
      font-family: Tahoma, Arial, sans-serif;
      color: white;
      padding: 16px;
    }
    .game { text-align: center; width: 100%; max-width: 380px; }
    h1 { font-size: 1.7rem; margin-bottom: 6px; color: #e0e7ff; }
    .subtitle { color: #a5b4fc; margin-bottom: 16px; font-size: 0.9rem; }
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      background: #0f0f1a;
      padding: 10px;
      border-radius: 14px;
      margin-bottom: 18px;
    }
    .tile {
      aspect-ratio: 1;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
      user-select: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
      transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), 
                  opacity 0.2s ease,
                  box-shadow 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }
    .tile:active {
      transform: scale(0.9);
    }
    .tile.moving {
      transform: scale(1.08);
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
      z-index: 10;
    }
    .tile.empty {
      background: transparent !important;
      cursor: default;
      box-shadow: none;
    }
    .btn {
      background: #6366f1;
      color: white;
      border: none;
      padding: 11px 22px;
      border-radius: 11px;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
      margin: 4px;
      transition: transform 0.15s, background 0.2s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-sound { background: #0d9488; }
    .moves { margin-top: 14px; color: #c7d2fe; }
    .win {
      margin-top: 14px;
      padding: 14px;
      background: #059669;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      display: none;
      animation: popIn 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .c1{background:#ef4444}.c2{background:#f97316}.c3{background:#eab308}.c4{background:#22c55e}
    .c5{background:#14b8a6}.c6{background:#06b6d4}.c7{background:#3b82f6}.c8{background:#6366f1}
    .c9{background:#8b5cf6}.c10{background:#a855f7}.c11{background:#d946ef}.c12{background:#ec4899}
    .c13{background:#f43f5e}.c14{background:#fb7185}.c15{background:#fda4af}
  </style>
</head>
<body>
  <div class="game">
    <h1>پازل رنگی 🧩</h1>
    <p class="subtitle">کاشی‌ها را جابه‌جا کن تا مرتب شوند</p>
    <div class="board" id="board"></div>

    <button class="btn btn-sound" id="soundBtn" onclick="enableSound()">فعال کردن صدا 🔊</button>
    <button class="btn" onclick="shuffleBoard()">شروع مجدد</button>

    <div class="moves">تعداد حرکت: <span id="moves">0</span></div>
    <div class="win" id="win">آفرین! پازل رو حل کردی 🎉</div>
  </div>

  <script>
    const SIZE = 4;
    let tiles = [], emptyIndex = 15, moves = 0, isWon = false;
    let soundEnabled = false;
    let audioCtx = null;

    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const winEl = document.getElementById('win');
    const soundBtn = document.getElementById('soundBtn');
    const colors = ['c1','c2','c3','c4','c5','c6','c7','c8','c9','c10','c11','c12','c13','c14','c15'];

    function enableSound() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      audioCtx.resume().then(() => {
        soundEnabled = true;
        soundBtn.textContent = 'صدا فعال است ✅';
        soundBtn.style.background = '#059669';
        playBeep(600, 0.1);
      }).catch(() => {
        soundBtn.textContent = 'صدا پشتیبانی نمی‌شود';
      });
    }

    function playBeep(freq, duration) {
      if (!soundEnabled || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playMoveSound() {
      playBeep(520, 0.08);
    }

    function playWinSound() {
      playBeep(523, 0.15);
      setTimeout(() => playBeep(659, 0.15), 150);
      setTimeout(() => playBeep(784, 0.15), 300);
      setTimeout(() => playBeep(1046, 0.25), 450);
    }

    function render() {
      boardEl.innerHTML = '';
      tiles.forEach((val, i) => {
        const t = document.createElement('div');
        t.className = 'tile';
        if (val === 0) {
          t.classList.add('empty');
        } else {
          t.classList.add(colors[val - 1]);
          t.textContent = val;
          t.onclick = () => moveTile(i);
        }
        boardEl.appendChild(t);
      });
    }

    function moveTile(i) {
      if (isWon) return;
      const r = Math.floor(i / SIZE), c = i % SIZE;
      const er = Math.floor(emptyIndex / SIZE), ec = emptyIndex % SIZE;

      if ((Math.abs(r - er) === 1 && c === ec) || (Math.abs(c - ec) === 1 && r === er)) {
        // انیمیشن نرم
        const tileEl = boardEl.children[i];
        if (tileEl) {
          tileEl.classList.add('moving');
          setTimeout(() => tileEl.classList.remove('moving'), 200);
        }

        [tiles[i], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[i]];
        emptyIndex = i;
        moves++;
        movesEl.textContent = moves;
        playMoveSound();
        render();
        checkWin();
      }
    }

    function checkWin() {
      for (let i = 0; i < 15; i++) if (tiles[i] !== i + 1) return;
      isWon = true;
      winEl.style.display = 'block';
      playWinSound();
    }

    function shuffleBoard() {
      tiles = [...Array(15).keys()].map(x => x + 1).concat([0]);
      emptyIndex = 15;
      moves = 0;
      isWon = false;
      winEl.style.display = 'none';
      movesEl.textContent = '0';

      for (let k = 0; k < 100; k++) {
       const ec = emptyIndex % SIZE; const er = Math.floor(emptyIndex / SIZE), ec = emptyIndex % SIZE;
        const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
        const possible = [];
        dirs.forEach(([dr, dc]) => {
          const nr = er + dr, nc = ec + dc;
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) possible.push(nr * SIZE + nc);
        });
        const rand = possible[Math.floor(Math.random() * possible.length)];
        [tiles[rand], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[rand]];
        emptyIndex = rand;
      }
      render();
    }

    shuffleBoard();
  </script>
<script>
let best = localStorage.getItem("bestMoves") || 9999;

const box = document.createElement("div");
box.style.cssText = "font-size:18px;margin:10px;";
box.innerHTML = "🏆 رکورد: " + (best == 9999 ? "هنوز ثبت نشده" : best + " حرکت");
document.body.appendChild(box);

setInterval(() => {
  const text = document.body.innerText;
  if (text.includes("آفرین!")) {
    const m = text.match(/تعداد حرکت:\s*(\d+)/);
    if (m) {
      const moves = Number(m[1]);
      if (moves < best) {
        best = moves;
        localStorage.setItem("bestMoves", best);
        box.innerHTML = "🏆 رکورد جدید: " + best + " حرکت 🎉";
      }
    }
  }
}, 500);
</script></body>
</html>
